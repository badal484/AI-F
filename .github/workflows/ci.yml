name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated into packages/db/src/generated/
      # (gitignored — see .gitignore's own comment) rather than shipped,
      # so a fresh checkout has no generated types until this runs.
      # Needs only prisma/schema.prisma, not a live database — verified
      # throughout this repo's build history that this works with no
      # DATABASE_URL at all.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Also NOT CONFIGURED-safe end to end: every integration this app
      # uses (Supabase, Redis, WhatsApp, Stripe) degrades gracefully with
      # no env vars set, verified locally every phase of this build — so
      # this job intentionally passes zero secrets, not because they were
      # forgotten.
      - name: Build
        run: npm run build
